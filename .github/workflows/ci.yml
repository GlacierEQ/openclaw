name: OpenClaw CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src cli.py server.py mcp_server.py scripts tests
      - name: Tests
        run: python -m pytest
      - name: Runtime proof
        run: python scripts/operate.py
      - name: Dependency consistency
        run: python -m pip check

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t glaciereq-openclaw:${{ github.sha }} .
